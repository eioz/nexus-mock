name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: .\build.ps1 -Config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-mock
          path: build\x64\Release\nexus_mock.exe
